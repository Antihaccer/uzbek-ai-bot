
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Uzbek AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0e1a2b;
    --surface: #16243a;
    --surface-2: #1c2d47;
    --turquoise: #22d3c5;
    --turquoise-dim: #1a9c92;
    --gold: #d9a94e;
    --clay: #c1622d;
    --sand: #f3ede0;
    --text-primary: #eef2f7;
    --text-secondary: #93a3ba;
    --danger: #e06c5a;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    position: relative;
    background:
      radial-gradient(ellipse 600px 300px at 20% -5%, rgba(34,211,197,0.10), transparent),
      radial-gradient(ellipse 500px 260px at 90% 0%, rgba(217,169,78,0.08), transparent),
      var(--ink);
  }

  /* ---------- Header ---------- */
  header {
    flex-shrink: 0;
    padding: 18px 20px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--turquoise), var(--turquoise-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(34,211,197,0.25);
  }
  .logo-mark svg { width: 18px; height: 18px; }

  .brand-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    line-height: 1;
  }
  .brand-sub {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 3px;
    letter-spacing: 0.02em;
  }

  .ornament {
    height: 3px;
    margin: 0 20px;
    flex-shrink: 0;
    background-image: repeating-linear-gradient(
      90deg,
      var(--turquoise) 0px, var(--turquoise) 6px,
      var(--gold) 6px, var(--gold) 10px,
      transparent 10px, transparent 16px
    );
    opacity: 0.55;
    border-radius: 2px;
  }

  /* ---------- Messages ---------- */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    -webkit-overflow-scrolling: touch;
  }

  .msg-row { display: flex; gap: 9px; max-width: 100%; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }

  .avatar {
    width: 26px; height: 26px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--gold), var(--clay));
    margin-top: 2px;
  }
  .avatar svg { width: 14px; height: 14px; }

  .bubble {
    padding: 11px 14px;
    border-radius: var(--radius-md);
    font-size: 15px;
    line-height: 1.48;
    max-width: 78%;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-row.user .bubble {
    background: linear-gradient(135deg, var(--turquoise-dim), #157a72);
    color: #eafffb;
    border-bottom-right-radius: 4px;
  }
  .msg-row.assistant .bubble {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.05);
    border-bottom-left-radius: 4px;
  }
  .bubble .cursor {
    display: inline-block;
    width: 2px; height: 14px;
    background: var(--turquoise);
    margin-left: 2px;
    animation: blink 0.9s step-start infinite;
    vertical-align: middle;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .bubble img.gen-image {
    max-width: 100%;
    border-radius: var(--radius-sm);
    margin-top: 6px;
    display: block;
  }

  .subscribe-card {
    background: var(--surface);
    border: 1px solid rgba(217,169,78,0.25);
    border-radius: var(--radius-md);
    padding: 16px;
    text-align: center;
    margin: 20px auto;
    max-width: 320px;
  }
  .subscribe-card p { margin: 0 0 12px; font-size: 14px; color: var(--text-secondary); }
  .subscribe-card a.btn-primary { text-decoration: none; }

  /* ---------- Composer ---------- */
  #composer {
    flex-shrink: 0;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }

  .composer-pill {
    flex: 1;
    display: flex;
    align-items: flex-end;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 22px;
    padding: 6px 6px 6px 16px;
    gap: 6px;
  }

  #text-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.4;
    max-height: 110px;
    padding: 8px 0;
    resize: none;
  }
  #text-input::placeholder { color: var(--text-secondary); }

  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.12s ease, background 0.15s ease;
    background: transparent;
    color: var(--text-secondary);
  }
  .icon-btn:active { transform: scale(0.9); }
  .icon-btn svg { width: 19px; height: 19px; }

  #mic-btn.recording {
    background: var(--clay);
    color: white;
    animation: pulse-rec 1.2s ease-in-out infinite;
  }
  @keyframes pulse-rec {
    0%, 100% { box-shadow: 0 0 0 0 rgba(193,98,45,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(193,98,45,0); }
  }

  #image-toggle.active {
    background: rgba(217,169,78,0.18);
    color: var(--gold);
  }

  #send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--turquoise), var(--turquoise-dim));
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.12s ease, opacity 0.15s ease;
  }
  #send-btn:active { transform: scale(0.9); }
  #send-btn:disabled { opacity: 0.35; pointer-events: none; }
  #send-btn svg { width: 17px; height: 17px; }

  .mode-banner {
    font-size: 11.5px;
    color: var(--gold);
    text-align: center;
    padding-bottom: 4px;
    display: none;
    letter-spacing: 0.02em;
  }
  .mode-banner.show { display: block; }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, var(--turquoise), var(--turquoise-dim));
    color: #06231f;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    color: var(--text-secondary);
  }
  .empty-state .logo-mark { width: 52px; height: 52px; border-radius: 16px; margin-bottom: 16px; }
  .empty-state .logo-mark svg { width: 26px; height: 26px; }
  .empty-state h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--text-primary);
    margin: 0 0 6px;
  }
  .empty-state p { font-size: 13.5px; margin: 0; max-width: 260px; }

  .typing-dots { display: inline-flex; gap: 3px; padding: 4px 0; }
  .typing-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--turquoise);
    animation: tdot 1.1s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes tdot { 0%, 60%, 100% { opacity: 0.25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3L13.8 9.2L20 11L13.8 12.8L12 19L10.2 12.8L4 11L10.2 9.2L12 3Z" fill="#06231f"/></svg>
    </div>
    <div>
      <div class="brand-title">Uzbek AI</div>
      <div class="brand-sub">Sun'iy intellekt yordamchi</div>
    </div>
  </header>
  <div class="ornament"></div>

  <div id="messages"></div>

  <div class="mode-banner" id="mode-banner">🎨 Rasm rejimi — tavsif yozing</div>
  <div id="composer">
    <button class="icon-btn" id="image-toggle" title="Rasm chizish rejimi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
      </svg>
    </button>
    <div class="composer-pill">
      <textarea id="text-input" placeholder="Xabar yozing..." rows="1"></textarea>
      <button class="icon-btn" id="mic-btn" title="Ovozli xabar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>
    </div>
    <button id="send-btn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="#06231f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
      </svg>
    </button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0e1a2b');
  tg.setBackgroundColor('#0e1a2b');
}

const initData = tg?.initData || '';
const messagesEl = document.getElementById('messages');
const textInput = document.getElementById('text-input');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('mic-btn');
const imageToggle = document.getElementById('image-toggle');
const modeBanner = document.getElementById('mode-banner');

let imageMode = false;
let isBusy = false;
let mediaRecorder = null;
let audioChunks = [];
let sessionChannelUrl = '';

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderMarkdownLite(text) {
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(role, text, opts = {}) {
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  if (role === 'assistant') {
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3L13.8 9.2L20 11L13.8 12.8L12 19L10.2 12.8L4 11L10.2 9.2L12 3Z" fill="white"/></svg>';
    row.appendChild(avatar);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderMarkdownLite(text);
  row.appendChild(bubble);

  messagesEl.appendChild(row);
  scrollToBottom();
  return bubble;
}

function addTypingBubble() {
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3L13.8 9.2L20 11L13.8 12.8L12 19L10.2 12.8L4 11L10.2 9.2L12 3Z" fill="white"/></svg>';
  row.appendChild(avatar);
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollToBottom();
  return bubble;
}

function showSubscribeCard(channelUrl) {
  const card = document.createElement('div');
  card.className = 'subscribe-card';
  card.innerHTML = `
    <p>Botdan foydalanish uchun avval kanalimizga obuna bo'ling</p>
    <a class="btn-primary" href="${channelUrl}" target="_blank">📢 Kanalga o'tish</a>
  `;
  messagesEl.appendChild(card);
  scrollToBottom();
}

function setBusy(busy) {
  isBusy = busy;
  sendBtn.disabled = busy || textInput.value.trim().length === 0;
}

function autoResize() {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 110) + 'px';
}

textInput.addEventListener('input', () => {
  autoResize();
  sendBtn.disabled = isBusy || textInput.value.trim().length === 0;
});

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

imageToggle.addEventListener('click', () => {
  imageMode = !imageMode;
  imageToggle.classList.toggle('active', imageMode);
  modeBanner.classList.toggle('show', imageMode);
  textInput.placeholder = imageMode ? "Nima chizay?..." : "Xabar yozing...";
  tg?.HapticFeedback?.impactOccurred('light');
});

sendBtn.addEventListener('click', handleSend);

async function handleSend() {
  const text = textInput.value.trim();
  if (!text || isBusy) return;

  textInput.value = '';
  autoResize();
  setBusy(true);
  tg?.HapticFeedback?.impactOccurred('light');

  addMessage('user', text);

  if (imageMode) {
    await requestImage(text);
  } else {
    await requestChat(text);
  }

  setBusy(false);
}

async function requestChat(text) {
  const bubble = addTypingBubble();
  let firstChunk = true;

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: initData, message: text }),
    });

    if (resp.status === 403) {
      const data = await resp.json();
      bubble.parentElement.remove();
      showSubscribeCard(data.channel_url || sessionChannelUrl);
      return;
    }
    if (!resp.ok || !resp.body) {
      bubble.innerHTML = "Kechirasiz, hozir javob bera olmadim. 🙏";
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        const evt = JSON.parse(part.slice(6));
        if (evt.type === 'chunk') {
          if (firstChunk) { bubble.innerHTML = ''; firstChunk = false; }
          bubble.innerHTML = renderMarkdownLite(evt.text) + '<span class="cursor"></span>';
          scrollToBottom();
        } else if (evt.type === 'done') {
          bubble.innerHTML = renderMarkdownLite(evt.text);
          scrollToBottom();
        } else if (evt.type === 'error') {
          bubble.innerHTML = "Kechirasiz, hozir javob bera olmadim. 🙏";
        }
      }
    }
  } catch (err) {
    bubble.innerHTML = "Aloqa xatosi. Internetni tekshiring. 🙏";
  }
}

async function requestImage(prompt) {
  const bubble = addTypingBubble();
  bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span> Rasm chizilmoqda...';

  try {
    const resp = await fetch('/api/image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: initData, prompt }),
    });

    if (resp.status === 403) {
      const data = await resp.json();
      bubble.parentElement.remove();
      showSubscribeCard(data.channel_url || sessionChannelUrl);
      return;
    }
    const data = await resp.json();
    if (!resp.ok) {
      bubble.innerHTML = "Kechirasiz, rasm yaratib bo'lmadi. 🙏";
      return;
    }

    bubble.innerHTML = `🎨 ${escapeHtml(prompt)}<img class="gen-image" src="data:${data.mime};base64,${data.image_base64}">`;
    scrollToBottom();
  } catch (err) {
    bubble.innerHTML = "Aloqa xatosi. Internetni tekshiring. 🙏";
  }
}

// ---------- Ovoz yozish ----------
micBtn.addEventListener('mousedown', startRecording);
micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
micBtn.addEventListener('mouseup', stopRecording);
micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
micBtn.addEventListener('mouseleave', () => { if (mediaRecorder?.state === 'recording') stopRecording(); });

async function startRecording() {
  if (isBusy) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
    mediaRecorder.onstop = onRecordingStop;
    mediaRecorder.start();
    micBtn.classList.add('recording');
    tg?.HapticFeedback?.impactOccurred('medium');
  } catch (err) {
    addMessage('assistant', "Mikrofonga ruxsat berilmadi. 🙏");
  }
}

function stopRecording() {
  if (mediaRecorder?.state === 'recording') {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
  micBtn.classList.remove('recording');
}

async function onRecordingStop() {
  if (audioChunks.length === 0) return;
  const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });

  if (audioBlob.size < 1000) return; // juda qisqa, e'tiborsiz qoldiramiz

  setBusy(true);
  const bubble = addTypingBubble();
  bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span> Ovoz tinglanmoqda...';

  try {
    const formData = new FormData();
    formData.append('init_data', initData);
    formData.append('audio', audioBlob, 'voice.webm');

    const resp = await fetch('/api/voice', { method: 'POST', body: formData });
    const data = await resp.json();

    if (resp.status === 403) {
      bubble.parentElement.remove();
      showSubscribeCard(data.channel_url || sessionChannelUrl);
      setBusy(false);
      return;
    }
    if (!resp.ok || !data.transcript) {
      bubble.innerHTML = "Ovozli xabarni tushuna olmadim. 🙏";
      setBusy(false);
      return;
    }

    bubble.parentElement.remove();
    addMessage('user', data.transcript);
    await requestChat(data.transcript);
  } catch (err) {
    bubble.innerHTML = "Aloqa xatosi. 🙏";
  }
  setBusy(false);
}

// ---------- Ishga tushirish ----------
async function init() {
  if (!initData) {
    messagesEl.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3L13.8 9.2L20 11L13.8 12.8L12 19L10.2 12.8L4 11L10.2 9.2L12 3Z" fill="#06231f"/></svg></div>
      <h2>Uzbek AI</h2>
      <p>Bu ilova faqat Telegram ichida ishlaydi. Iltimos, botni Telegram orqali oching.</p>
    `;
    messagesEl.appendChild(empty);
    return;
  }

  try {
    const resp = await fetch('/api/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: initData }),
    });
    const data = await resp.json();
    sessionChannelUrl = data.channel_url || '';

    if (!data.subscribed) {
      showSubscribeCard(data.channel_url);
      return;
    }

    if (data.history && data.history.length > 0) {
      for (const msg of data.history) {
        if (msg.role === 'user' && typeof msg.content === 'string') {
          addMessage('user', msg.content);
        } else if (msg.role === 'assistant') {
          addMessage('assistant', msg.content);
        }
      }
    } else {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `
        <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3L13.8 9.2L20 11L13.8 12.8L12 19L10.2 12.8L4 11L10.2 9.2L12 3Z" fill="#06231f"/></svg></div>
        <h2>Assalomu alaykum${data.user?.first_name ? ', ' + escapeHtml(data.user.first_name) : ''}!</h2>
        <p>Menga istalgan savolingizni yozing, ovozli xabar yuboring yoki rasm chizdiring 🎨</p>
      `;
      messagesEl.appendChild(empty);
    }
  } catch (err) {
    messagesEl.innerHTML = '<div class="empty-state"><p>Ulanishda xatolik. Qayta urinib ko\'ring.</p></div>';
  }
}

init();
</script>
</body>
</html>
